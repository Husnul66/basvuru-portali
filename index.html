<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kariyer & Başvuru Portalı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      padding: 32px 36px;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    form {
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      .header, form { padding: 24px 20px; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    label span { color: var(--error); }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    textarea { resize: vertical; min-height: 95px; }

    .file-drop {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .file-drop:hover, .file-drop.active {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-drop-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .file-drop-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .file-name {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--success);
      display: none;
    }

    button[type="submit"] {
      margin-top: 6px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button[type="submit"]:hover { background: var(--primary-hover); }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.65; cursor: not-allowed; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      line-height: 1.4;
    }

    .alert.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .alert.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Başvuru Formu</h1>
      <p>Bilgilerinizi eksiksiz doldurup CV dosyanızı yükleyin. Başvurunuz değerlendirildikten sonra e-posta ile dönüş yapılacaktır.</p>
    </div>

    <form id="applicationForm">
      <div class="row">
        <div class="field">
          <label for="isim_soyisim">İsim Soyisim <span>*</span></label>
          <input type="text" id="isim_soyisim" name="isim_soyisim" placeholder="Örn: Ahmet Yılmaz" required />
        </div>
        <div class="field">
          <label for="eposta">E-posta Adresi <span>*</span></label>
          <input type="email" id="eposta" name="eposta" placeholder="ornek@mail.com" required />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="medeni_durum">Medeni Durum <span>*</span></label>
          <select id="medeni_durum" name="medeni_durum" required>
            <option value="" disabled selected>Seçiniz</option>
            <option value="Bekar">Bekar</option>
            <option value="Evli">Evli</option>
          </select>
        </div>
        <div class="field">
          <label for="gelir">Aylık Gelir Beklentisi (TL) <span>*</span></label>
          <input type="number" id="gelir" name="gelir" placeholder="Örn: 35000" min="0" required />
        </div>
      </div>

      <div class="field">
        <label for="tecrube">İş Tecrübesi & Yetkinlikler <span>*</span></label>
        <textarea id="tecrube" name="tecrube" placeholder="Çalıştığınız projeler, kullandığınız teknolojiler veya deneyim süreniz..." required></textarea>
      </div>

      <div class="field">
        <label>CV Yükle (PDF / DOCX) <span>*</span></label>
        <div class="file-drop" id="fileDrop">
          <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required />
          <div class="file-drop-title">Dosya seçmek için tıklayın veya sürükleyin</div>
          <div class="file-drop-sub">Maksimum dosya boyutu: 10 MB</div>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <div class="alert" id="statusAlert"></div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Başvuruyu Gönder</span>
      </button>
    </form>
  </div>

  <script>
    // BURAYA ACTIVEPIECES WEBHOOK URL ADRESİNİ YAPIŞTIR:
    const WEBHOOK_URL = "https://cloud.activepieces.com/api/v1/webhooks/aDq9DdHFHStVImhnKjhYw";

    const form = document.getElementById("applicationForm");
    const cvInput = document.getElementById("cv");
    const fileNameDisplay = document.getElementById("fileName");
    const fileDrop = document.getElementById("fileDrop");
    const submitBtn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const btnText = document.getElementById("btnText");
    const statusAlert = document.getElementById("statusAlert");

    cvInput.addEventListener("change", () => {
      if (cvInput.files.length > 0) {
        fileNameDisplay.textContent = "Seçilen dosya: " + cvInput.files[0].name;
        fileNameDisplay.style.display = "block";
      } else {
        fileNameDisplay.style.display = "none";
      }
    });

    fileDrop.addEventListener("dragover", (e) => {
      e.preventDefault();
      fileDrop.classList.add("active");
    });

    fileDrop.addEventListener("dragleave", () => fileDrop.classList.remove("active"));
    fileDrop.addEventListener("drop", () => fileDrop.classList.remove("active"));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusAlert.style.display = "none";

      if (WEBHOOK_URL.includes("BURAYA_KENDI_ID_GELECEK")) {
        showAlert("Lütfen index.html içindeki WEBHOOK_URL alanına kendi Activepieces adresinizi yapıştırın.", "error");
        return;
      }

      submitBtn.disabled = true;
      spinner.style.display = "inline-block";
      btnText.textContent = "Gönderiliyor...";

      try {
        const formData = new FormData(form);
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          showAlert("Başvurunuz başarıyla alındı! Onay e-postası adresinize gönderildi.", "success");
          form.reset();
          fileNameDisplay.style.display = "none";
        } else {
          throw new Error("Sunucu yanıt kodu: " + response.status);
        }
      } catch (err) {
        showAlert("Gönderim sırasında bir hata oluştu. Lütfen daha sonra tekrar deneyin.", "error");
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Başvuruyu Gönder";
      }
    });

    function showAlert(message, type) {
      statusAlert.textContent = message;
      statusAlert.className = "alert " + type;
      statusAlert.style.display = "block";
    }
  </script>
</body>
</html>
